<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Astro Global</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="app-header">
      <a class="brand-lockup" href="#home" data-view="home" data-route="/" aria-label="Astro Global home">
        <span class="brand-mark" aria-hidden="true">
          <span class="brand-core"></span>
          <span class="brand-ring brand-ring-one"></span>
          <span class="brand-ring brand-ring-two"></span>
        </span>
        <span>
          <span class="brand-name">Astro Global</span>
          <span class="brand-subtitle">Historical Planetary Resonance Explorer</span>
        </span>
      </a>

      <nav class="primary-nav" aria-label="Main navigation">
        <button class="nav-link active" type="button" data-view="home" data-route="/">Home</button>
        <button class="nav-link" type="button" data-view="today" data-route="/today">Today</button>
        <button class="nav-link" type="button" data-view="explorer" data-route="/explorer">Explorer</button>
        <button class="nav-link" type="button" data-view="compare" data-route="/compare">Compare</button>
        <button class="nav-link" type="button" data-view="calendar" data-route="/calendar">Calendar</button>
        <button class="nav-link" type="button" data-view="insights" data-route="/insights">Insights</button>
        <button class="nav-link" type="button" data-view="library" data-route="/library">Library</button>
        <button class="nav-link" type="button" data-view="blog" data-route="/blog">Blog</button>
        <button class="nav-link" type="button" data-view="contact" data-route="/contact">Contact</button>
        <a class="nav-link nav-link-anchor" href="./transparency/">Transparency</a>
      </nav>

      <div class="header-actions" aria-label="Workspace actions">
        <button class="icon-button" type="button" data-action="refresh-view" aria-label="Refresh current view">
          <span aria-hidden="true">R</span>
        </button>
        <button class="profile-chip" type="button" aria-label="Account">AG</button>
      </div>
    </header>

    <details class="developer-drawer" id="developerSettings">
      <summary>Developer settings</summary>
      <div class="developer-panel" aria-label="Backend connection settings">
        <p class="developer-note">FastAPI connection for local development.</p>
        <label>
          API base
          <input id="apiBase" name="apiBase" value="http://127.0.0.1:8765" autocomplete="off" />
        </label>
        <label>
          Session token
          <input
            id="sessionToken"
            name="sessionToken"
            type="password"
            value="dev-local-token"
            autocomplete="off"
          />
        </label>
        <button class="primary-action" id="connectButton" type="button">Connect backend</button>
        <div class="connection-state" id="connectionState" aria-live="polite">
          <span class="status-pill">not connected</span>
        </div>
      </div>
    </details>

    <main class="site-shell">
      <div class="product-root" id="appRoot" aria-live="polite"></div>
    </main>

    <script src="./shell.js" type="module"></script>
  </body>
</html>
