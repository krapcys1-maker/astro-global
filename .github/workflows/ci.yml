name: CI

on:
  push:
    branches:
      - main
      - astro-global
  pull_request:
    branches:
      - main
      - astro-global

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backend:
    name: Backend checks
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,astro]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

      - name: Check resonance API golden
        run: python scripts/update_resonance_api_golden.py --check

      - name: Check resonance compare golden
        run: python scripts/update_resonance_compare_golden.py --check

      - name: Check resonance compare presets golden
        run: python scripts/update_resonance_compare_presets_golden.py --check

      - name: Check OpenAPI contract
        run: python scripts/export_openapi_contract.py --check

      - name: Validate curated events
        run: python scripts/validate_curated_data.py

      - name: Dry-run curated event ingest
        run: python scripts/ingest_curated_events.py --dry-run

      - name: Report historical data bias
        run: python scripts/report_historical_data_bias.py --format json

      - name: Report reliable history coverage
        run: |
          python scripts/report_reliable_history_coverage.py --format json
          python scripts/report_reliable_history_coverage.py --format markdown

      - name: Deploy config smoke test
        run: python scripts/smoke_test_deploy_config.py

      - name: Web shell smoke test
        run: python scripts/smoke_test_web_shell.py

      - name: Web API E2E smoke test
        run: python scripts/smoke_test_web_api_e2e.py

      - name: Build Swiss resonance index
        run: >
          python scripts/build_planetary_index.py
          --provider swiss
          --start 1900-01-01
          --end 2026-05-23
          --step-days 7
          --output data/vectors/swiss_1900_now_global_slow_v1.npz

      - name: Build Swiss reliable history index
        run: >
          python scripts/build_planetary_index.py
          --provider swiss
          --start 1500-01-01
          --end 2026-05-23
          --step-days 7
          --output data/vectors/swiss_1500_now_global_slow_v1.npz

      - name: Product smoke test
        run: python scripts/smoke_test_product_path.py

      - name: Product smoke test pre-1900
        run: >
          python scripts/smoke_test_product_path.py
          --date 1789-07-14T00:00:00Z
          --index-file swiss_1500_now_global_slow_v1.npz
          --skip-expected-event-check

      - name: Benchmark known resonance cases
        run: python scripts/benchmark_known_resonance_cases.py

      - name: Compile Python modules
        run: python -m compileall services scripts tests -q

      - name: Check whitespace
        run: git diff --check
