name: CI

on:
  push:
    branches:
      - main
      - astro-global
  pull_request:
    branches:
      - main
      - astro-global

jobs:
  backend:
    name: Backend checks
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,astro]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

      - name: Check resonance API golden
        run: python scripts/update_resonance_api_golden.py --check

      - name: Validate curated events
        run: python scripts/validate_curated_data.py

      - name: Dry-run curated event ingest
        run: python scripts/ingest_curated_events.py --dry-run

      - name: Report historical data bias
        run: python scripts/report_historical_data_bias.py --format json

      - name: Build Swiss resonance index
        run: >
          python scripts/build_planetary_index.py
          --provider swiss
          --start 1900-01-01
          --end 2026-05-23
          --step-days 7
          --output data/vectors/swiss_1900_now_global_slow_v1.npz

      - name: Benchmark known resonance cases
        run: python scripts/benchmark_known_resonance_cases.py

      - name: Compile Python modules
        run: python -m compileall services scripts tests -q

      - name: Check whitespace
        run: git diff --check
